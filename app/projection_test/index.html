<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DNDT Projection Test</title>
    <link rel="stylesheet" href="./projectionTest.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="eyebrow">DNDT projection proof</div>
          <h1>Yaw 35 / Pitch 60 / Orthographic</h1>
        </div>
        <div class="controls" aria-label="Projection controls">
          <label>
            <span>Yaw <output id="yawValue">35</output></span>
            <input id="yawSlider" type="range" min="20" max="55" step="1" value="35">
          </label>
          <label>
            <span>Pitch <output id="pitchValue">60</output></span>
            <input id="pitchSlider" type="range" min="30" max="75" step="1" value="60">
          </label>
        </div>
        <div class="readout" id="readout"></div>
      </header>
      <section class="stage" aria-label="Projected tactical grid proof">
        <svg id="projectionSvg" viewBox="0 0 1000 620" role="img" aria-labelledby="projectionTitle">
          <title id="projectionTitle">Projected square grid with two cell-centered bases</title>
        </svg>
      </section>
      <footer>Hold TAB to hide/reveal grid lines. Bases and center marks remain tied to grid coordinates.</footer>
    </main>
    <script type="module" src="./projectionTest.js"></script>
  </body>
</html>
