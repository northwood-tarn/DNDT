<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="chalk-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="4" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grey-noise"/>
      <feBlend in="SourceGraphic" in2="grey-noise" mode="multiply"/>
    </filter>
    <clipPath id="dome-clip">
      <!-- Flat edge is exactly y=512, the horizontal centreline. -->
      <path d="M171 512 L171 502
               C174 327 327 171 512 171
               C697 171 850 327 853 502
               L853 512 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#050607"/>

  <!-- Exact two-thirds-width upward-facing semicircle. -->
  <path d="M171 512 L171 502
           C174 327 327 171 512 171
           C697 171 850 327 853 502
           L853 512 Z"
        fill="#e8e6df"/>

  <g clip-path="url(#dome-clip)">
    <rect x="171" y="171" width="682" height="341" fill="#fffef7" filter="url(#chalk-grain)"/>
  </g>

  <!-- Chalk loss and crossed hand strokes, clipped inside the exact geometry. -->
  <g clip-path="url(#dome-clip)" opacity="0.3" stroke="#fffef7" stroke-width="13" stroke-linecap="round">
    <path d="M178 487 C310 462 472 483 681 451 M219 405 C375 374 550 404 810 365 M287 319 C431 294 605 315 756 287 M382 233 C497 219 599 229 683 215"/>
  </g>

  <!-- Slightly broken chalk dust only along the rounded profile; flat edge remains exact. -->
  <path d="M171 502 C174 327 327 171 512 171 C697 171 850 327 853 502"
        fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="17 3 31 2 9 2" opacity="0.72"/>

</svg>
