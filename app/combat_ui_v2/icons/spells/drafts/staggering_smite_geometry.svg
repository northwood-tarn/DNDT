<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="chalk-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="4" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grey-noise"/>
      <feBlend in="SourceGraphic" in2="grey-noise" mode="multiply"/>
    </filter>
    <filter id="line-bloom" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <clipPath id="dome-clip">
      <path d="M171 512 L171 502 C174 327 327 171 512 171 C697 171 850 327 853 502 L853 512 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#050607"/>

  <!-- The locked Smite semicircle, unchanged. -->
  <path d="M171 512 L171 502 C174 327 327 171 512 171 C697 171 850 327 853 502 L853 512 Z" fill="#e8e6df"/>
  <g clip-path="url(#dome-clip)">
    <rect x="171" y="171" width="682" height="341" fill="#fffef7" filter="url(#chalk-grain)"/>
  </g>
  <g clip-path="url(#dome-clip)" opacity="0.3" stroke="#fffef7" stroke-width="13" stroke-linecap="round">
    <path d="M178 487 C310 462 472 483 681 451 M219 405 C375 374 550 404 810 365 M287 319 C431 294 605 315 756 287 M382 233 C497 219 599 229 683 215"/>
  </g>
  <path d="M171 502 C174 327 327 171 512 171 C697 171 850 327 853 502"
        fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="17 3 31 2 9 2" opacity="0.72"/>

  <!-- Jagged line: same endpoints, overall length and thickness as Blinding Smite. -->
  <path d="M369 735 L403 710 L438 752 L475 719 L512 758 L548 706 L584 748 L620 716 L655 735"
        fill="none" stroke="#ffe85a" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.22" filter="url(#line-bloom)"/>
  <path d="M369 735 L403 710 L438 752 L475 719 L512 758 L548 706 L584 748 L620 716 L655 735"
        fill="none" stroke="#fff8ad" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M369 735 L403 710 L438 752 L475 719 L512 758 L548 706 L584 748 L620 716 L655 735"
        fill="none" stroke="#fffef0" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="31 2 17 3 43 2"/>
  <path d="M379 732 L405 718 L437 746 L475 727 L511 750 L548 714 L584 741 L620 724 L645 737"
        fill="none" stroke="#d5b934" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.42"/>
</svg>
