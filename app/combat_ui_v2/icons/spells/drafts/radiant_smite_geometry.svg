<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="chalk-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="4" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grey-noise"/>
      <feBlend in="SourceGraphic" in2="grey-noise" mode="multiply"/>
    </filter>
    <filter id="star-bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="dome-clip">
      <path d="M171 512 L171 502 C174 327 327 171 512 171 C697 171 850 327 853 502 L853 512 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#050607"/>

  <!-- The locked Divine Smite semicircle, unchanged. -->
  <path d="M171 512 L171 502 C174 327 327 171 512 171 C697 171 850 327 853 502 L853 512 Z"
        fill="#e8e6df"/>
  <g clip-path="url(#dome-clip)">
    <rect x="171" y="171" width="682" height="341" fill="#fffef7" filter="url(#chalk-grain)"/>
  </g>
  <g clip-path="url(#dome-clip)" opacity="0.3" stroke="#fffef7" stroke-width="13" stroke-linecap="round">
    <path d="M178 487 C310 462 472 483 681 451 M219 405 C375 374 550 404 810 365 M287 319 C431 294 605 315 756 287 M382 233 C497 219 599 229 683 215"/>
  </g>
  <path d="M171 502 C174 327 327 171 512 171 C697 171 850 327 853 502"
        fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="17 3 31 2 9 2" opacity="0.72"/>

  <!-- Bright yellow-white eight-point chalk star beneath the semicircle. -->
  <path d="M512 590 L535 681 L608 639 L566 712 L657 735 L566 758 L608 831 L535 789 L512 880 L489 789 L416 831 L458 758 L367 735 L458 712 L416 639 L489 681 Z"
        fill="#ffe85a" opacity="0.28" filter="url(#star-bloom)"/>
  <path d="M512 596 L534 684 L604 643 L563 713 L651 735 L563 757 L604 827 L534 786 L512 874 L490 786 L420 827 L461 757 L373 735 L461 713 L420 643 L490 684 Z"
        fill="#fff7a8" stroke="#fffde8" stroke-width="10" stroke-linejoin="round"/>
  <path d="M512 618 L529 693 L584 663 L554 718 L629 735 L554 752 L584 807 L529 777 L512 852 L495 777 L440 807 L470 752 L395 735 L470 718 L440 663 L495 693 Z"
        fill="#fffef2" opacity="0.86"/>
  <g fill="none" stroke="#e4ce5c" stroke-width="5" stroke-linecap="round" opacity="0.28">
    <path d="M431 724 L574 683 M411 746 L608 704 M436 773 L602 730 M477 808 L570 781"/>
  </g>
  <path d="M512 602 L534 684 L604 643 L563 713 L651 735 L563 757 L604 827 L534 786 L512 868 L490 786 L420 827 L461 757 L373 735 L461 713 L420 643 L490 684 Z"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-dasharray="19 3 8 2" stroke-linejoin="round" opacity="0.72"/>
</svg>
