<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Build Your Character's Miniature</title>
    <link rel="stylesheet" href="./pc_mini_builder.css">
  </head>
  <body>
    <main class="mini-builder">
      <aside class="controls">
        <header>
          <h1>Build Your Character's Miniature</h1>
          <a class="creator-link" href="../character_creator/index.html">Creator</a>
        </header>
        <form id="miniForm" class="control-grid">
          <div class="field-row">
            <label>Species <select id="speciesId"></select></label>
            <label>Body <select id="bodyTypeId"></select></label>
          </div>
          <div class="field-row">
            <label id="skinField">Skin <select id="skinToneId"></select></label>
            <label id="lineageField">Lineage <select id="lineageId"></select></label>
          </div>
          <div class="field-row">
            <label>Head <select id="headId"></select></label>
            <label id="hairField">Hair <select id="hairId"></select></label>
          </div>
          <div class="field-row">
            <label id="facialHairField">Facial hair <select id="facialHairId"></select></label>
            <label id="speciesFeatureField">Feature <select id="speciesFeatureMode"></select></label>
          </div>
          <div class="field-row">
            <label>Posture <select id="postureId"></select></label>
            <label>Class <select id="classId"></select></label>
          </div>
          <div class="field-row">
            <label>Outfit <select id="outfitId"></select></label>
            <label>Cloak <select id="cloakId"></select></label>
          </div>
          <label>Weapon display <select id="weaponDisplayId"></select></label>
          <div class="field-row">
            <label>Lanterna <select id="lanternaAttachmentId"></select></label>
            <label class="check-row"><input id="useUniqueBase" type="checkbox" checked> Betrayer's Coin</label>
          </div>
          <div id="customBaseFields" class="field-row" hidden>
            <label>Disc metal <select id="baseDisc"></select></label>
            <label>Rim metal <select id="baseRim"></select></label>
          </div>
          <div class="actions">
            <button id="exportPng" type="button">Export PNG</button>
            <button id="exportManifest" type="button">Export Manifest</button>
          </div>
          <div id="status" class="status" aria-live="polite"></div>
        </form>
      </aside>
      <section class="preview" aria-label="Miniature preview">
        <div class="stage-wrap">
          <canvas id="gridCanvas" width="980" height="552"></canvas>
          <canvas id="miniCanvas" width="980" height="552"></canvas>
        </div>
      </section>
    </main>
    <script type="module" src="./pc_mini_builder.js"></script>
  </body>
</html>
