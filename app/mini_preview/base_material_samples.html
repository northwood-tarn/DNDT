<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Base Material Samples</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #151515;
      color: #e6e0d6;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(1200px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: 0;
    }

    p {
      max-width: 760px;
      margin: 0 0 18px;
      color: #bcb5aa;
      font-size: 14px;
      line-height: 1.45;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #3a3834;
      background: #0f0f0f;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mini Base Material Samples</h1>
    <p>
      Preview assembled from the exported transparent PNG base assets.
    </p>
    <img
      src="assets/base_combinations/exported_base_grid_preview.png"
      alt="Preview grid assembled from exported worn metal miniature base PNG assets"
    >
  </main>
</body>
</html>
