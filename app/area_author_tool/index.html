<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DNDT Area Author Tool</title>
  <link rel="stylesheet" href="./tool.css" />
</head>
<body>
  <main id="app">
    <section id="start-panel" class="start-panel">
      <div class="start-copy">
        <h1>Area Author Tool</h1>
        <p>Import a 1920x1080 background image to begin authoring traversal.</p>
        <button id="choose-image-button" type="button">Choose 1920x1080 image</button>
        <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" hidden />
        <p id="start-status" class="status-line"></p>
      </div>
    </section>

    <section id="tool-panel" class="tool-panel" hidden>
      <aside class="sidebar">
        <div class="group">
          <label>
            <span>Area name</span>
            <input id="area-name" type="text" value="Untitled area" />
          </label>
          <label>
            <span>Area id</span>
            <input id="area-id" type="text" readonly />
          </label>
          <label>
            <span>Map type</span>
            <select id="area-kind">
              <option value="exploration">exploration</option>
              <option value="grand_exploration">grand_exploration</option>
              <option value="combat">combat</option>
            </select>
          </label>
          <label>
            <span>Background</span>
            <input id="background-path" type="text" readonly />
          </label>
        </div>

        <div class="group tool-buttons" aria-label="Navigation tools">
          <button id="tool-node" type="button" aria-pressed="true">Node V</button>
          <button id="tool-connect" type="button" aria-pressed="false">Connect C</button>
          <button id="tool-inflect" type="button" aria-pressed="false">Inflect B</button>
          <button id="tool-spawn" type="button" aria-pressed="false">Combat spawn P</button>
        </div>

        <div id="node-editor" class="group" hidden>
          <label>
            <span>Node name</span>
            <input id="node-label" type="text" />
          </label>
          <label>
            <span>Trigger</span>
            <select id="node-trigger">
              <option value="none">none</option>
              <option value="conversation">conversation</option>
              <option value="area_transition">area_transition</option>
              <option value="combat">combat</option>
            </select>
          </label>
          <label>
            <span>Scale</span>
            <input id="node-scale" type="number" min="0.25" max="1.5" step="0.01" />
          </label>
          <label>
            <span>Discovery</span>
            <select id="node-discovery">
              <option value="undiscovered">undiscovered</option>
              <option value="discovered">discovered</option>
            </select>
          </label>
          <label class="checkbox-row">
            <input id="node-show-label" type="checkbox" />
            <span>Show label when discovered</span>
          </label>
          <label>
            <span>Details</span>
            <textarea id="node-description" rows="4"></textarea>
          </label>
          <button id="mark-entry" type="button">Mark entry</button>
        </div>

        <div class="group">
          <button id="reset-nav" type="button">Reset nav</button>
          <button id="export-area" type="button">Export area</button>
          <button id="save-area" type="button">Save export</button>
        </div>

        <div class="group">
          <p id="status" class="status-line"></p>
          <ul id="validation-list" class="validation-list"></ul>
        </div>
      </aside>

      <section class="stage-wrap">
        <canvas id="stage" width="1920" height="1080"></canvas>
      </section>
    </section>
  </main>
  <script type="module" src="./tool.js"></script>
</body>
</html>
