<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Area Builder</title>
  <link rel="stylesheet" href="./mapSketcher.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>Area Builder</h1>
        <p>Solid terrain authoring for tactical combat boards.</p>
      </div>
      <div class="topbar-actions">
        <button id="importButton" type="button">Import</button>
        <button id="exportButton" type="button">Export JSON</button>
      </div>
    </header>

    <main class="workspace">
      <section class="stage-panel" aria-label="Area canvas">
        <div class="map-fields">
          <label>
            <span>Map name</span>
            <input id="mapName" type="text" value="Untitled Area">
          </label>
          <label>
            <span>Map id</span>
            <input id="mapId" type="text" value="untitled_area">
          </label>
          <label>
            <span>Mode</span>
            <select id="modeSelect">
              <option value="combat">Combat</option>
              <option value="exploration">Exploration</option>
            </select>
          </label>
          <label>
            <span>Size</span>
            <select id="sizeSelect"></select>
          </label>
          <button id="clearButton" type="button">Clear</button>
        </div>

        <div class="tool-strip">
          <button id="zDownButton" type="button">Z -</button>
          <strong id="zReadout">z 0.0</strong>
          <button id="zUpButton" type="button">Z +</button>
          <span>Arrow Up / Arrow Down moves placement by half a cube.</span>
        </div>

        <div class="canvas-wrap">
          <canvas id="areaCanvas" width="1280" height="760"></canvas>
        </div>
      </section>

      <aside class="sidebar" aria-label="Builder tools">
        <section>
          <h2>Build</h2>
          <div id="toolList" class="tool-list"></div>
        </section>

        <section>
          <h2>Selected</h2>
          <div id="selectedInfo" class="selected-info">grass solid at z 0.0</div>
          <div id="countsInfo" class="counts-info"></div>
        </section>

        <section>
          <h2>JSON</h2>
          <textarea id="jsonOutput" spellcheck="false" aria-label="Exported area JSON"></textarea>
        </section>
      </aside>
    </main>
  </div>

  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <script src="./mapSketcher.js" defer></script>
</body>
</html>
