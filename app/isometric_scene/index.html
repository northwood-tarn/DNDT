<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DNDT Isometric Scene</title>
    <link rel="stylesheet" href="./scene.css">
  </head>
  <body>
    <main>
      <section id="scene" class="scene" aria-label="Interactive isometric dock scene">
        <img class="scene-plate" src="./assets/isometric_dock_clean_plate.png" alt="">
        <svg id="overlay" class="scene-overlay" viewBox="0 0 1448 1086" aria-hidden="true"></svg>
        <div id="miniature" class="miniature" role="img" aria-label="Hooded lantern miniature">
          <div class="miniature-base"></div>
          <div class="miniature-figure"></div>
          <div class="miniature-stats">HP 31/31&nbsp;&nbsp;AC 15</div>
        </div>
      </section>
    </main>
    <script type="module" src="./scene.js"></script>
  </body>
</html>
