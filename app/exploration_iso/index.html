<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DNDT Exploration Iso Prototype</title>
    <link rel="stylesheet" href="./scene.css">
  </head>
  <body>
    <main>
      <section id="stage" class="stage" aria-label="Isometric exploration map prototype">
        <img class="plate" src="./greyharbour_dock_gridfirst/greyharbour_dock_gridfirst.art.png" alt="">
        <svg id="reachable" class="reachable" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
        <svg id="debug" class="debug" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
        <div id="darkness" class="darkness" aria-hidden="true"></div>
        <div id="hero" class="hero" aria-label="Player character" role="img">
          <div class="hero-shadow"></div>
          <div class="hero-body"></div>
        </div>
      </section>
      <aside>
        <div class="meta">
          <span>17 x 12</span>
          <span>128 x 64</span>
          <span>Exploration</span>
        </div>
        <label><input id="toggle-debug" type="checkbox"> Grid/debug overlay</label>
        <label><input id="toggle-reachable" type="checkbox"> Reachable route tint</label>
        <label><input id="toggle-darkness" type="checkbox"> Darkness test</label>
      </aside>
    </main>
    <script type="module" src="./scene.js"></script>
  </body>
</html>
